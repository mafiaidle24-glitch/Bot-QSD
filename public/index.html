<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel do Bot</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1e1f22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bot QSD">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
  --bg:#18181c; --panel:#232428; --panel2:#1e1f22; --line:#33353b; --text:#f2f3f5; --muted:#9a9ea6;
  --blue:#5865f2; --gray:#26272c; --green:#008545; --red:#d12d3d; --accent:#5865f2;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
a{color:#8ea1ff}
button,input,select,textarea{font:inherit;color:inherit}
header.top{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--panel2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top .brand{font-weight:700;font-size:17px}
header.top .sp{flex:1}
header.top img{width:30px;height:30px;border-radius:50%}
.wrap{max-width:1000px;margin:0 auto;padding:22px 16px 120px}
.center{min-height:70vh;display:grid;place-items:center;text-align:center}
.btn{background:var(--blue);border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-block;color:#fff}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.danger{background:var(--red)}
.btn.green{background:var(--green)}
.btn.small{padding:5px 10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px}
.gcard img,.gcard .ph{width:46px;height:46px;border-radius:50%;background:var(--gray);flex:none;display:grid;place-items:center;font-weight:700}
.gcard .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 18px}
nav.tabs button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
nav.tabs button.on{background:var(--blue);border-color:var(--blue);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 4px;font-size:16px}
.card>p.sub{margin:0 0 12px;color:var(--muted);font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 220px}
.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}
.field .lbl{font-size:12px;font-weight:700;color:#b5bac1;text-transform:uppercase;letter-spacing:.03em}
.field small{color:var(--muted)}
input[type=text],input[type=number],input[type=url],select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
input[type=color]{width:100%;height:38px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px}
textarea{resize:vertical;min-height:80px}
.chk{display:flex;align-items:center;gap:8px;margin:10px 0;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--blue)}
.mbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mbar select{width:auto;flex:1 1 140px;font-size:13px;padding:5px 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chip{background:var(--gray);border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 10px;font-size:13px;display:flex;gap:6px;align-items:center}
.chip button{background:none;border:0;cursor:pointer;color:var(--muted);font-size:15px;line-height:1}
.item{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;position:relative}
.item .x{position:absolute;top:8px;right:8px}
.dpreview{background:#2b2d31;border-radius:10px;padding:14px;display:flex;gap:12px;margin:10px 0}
.dpreview .av{width:42px;height:42px;border-radius:50%;flex:none}
.dpreview .nm{font-weight:600}
.dpreview .tag{background:var(--blue);border-radius:4px;font-size:11px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.dpreview .body{white-space:pre-wrap;word-break:break-word;margin-top:2px}
.dpreview img.prev{max-width:100%;border-radius:10px;margin-top:8px;display:block}
.men{background:rgba(88,101,242,.3);color:#c9d0ff;border-radius:4px;padding:0 3px}
.dbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dbtn{border-radius:8px;padding:8px 14px;font-weight:600;color:#fff;border:1px solid rgba(255,255,255,.08)}
.dbtn.s1{background:var(--blue)} .dbtn.s2{background:var(--gray)} .dbtn.s3{background:var(--green)} .dbtn.s4{background:var(--red)}
.lbl-s{font-size:12px;font-weight:700;color:#b5bac1;margin:10px 0 4px}
.edet{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}
.edet>summary{cursor:pointer;font-weight:600}
.epv{background:#2b2d31;border-left:4px solid #5865f2;border-radius:4px;padding:8px 14px 12px 12px;max-width:520px;margin-top:8px}
.epv-row{display:flex;gap:12px}
.epv-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;white-space:pre-wrap;word-break:break-word}
.epv-author{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.epv-author img,.epv-foot img{width:22px;height:22px;border-radius:50%}
.epv-title{font-weight:700;font-size:16px}
.epv-title.link{color:#00a8fc}
.epv-desc{font-size:14px}
.epv-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.epv-f{grid-column:1/-1;font-size:14px}
.epv-f.inl{grid-column:auto}
.epv-fn{font-weight:700;font-size:13px}
.epv-img{max-width:100%;border-radius:6px;margin-top:4px}
.epv-thumb{width:70px;height:70px;object-fit:cover;border-radius:6px;flex:none}
.epv-foot{display:flex;align-items:center;gap:8px;font-size:12px;color:#b5bac1;margin-top:2px}
.cpv{background:#2b2d31;border:1px solid #3f4147;border-left:4px solid #3f4147;border-radius:8px;padding:12px;margin-top:4px;display:flex;flex-direction:column;gap:8px;max-width:520px}
.cpv-h1{font-size:20px;font-weight:700}.cpv-h2{font-size:17px;font-weight:700}.cpv-h3{font-size:15px;font-weight:700}
.cpv-sec{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.cpv-gal{display:grid;gap:4px;grid-template-columns:repeat(2,1fr)}
.cpv-gal.one{grid-template-columns:1fr}
.cpv-gal img{width:100%;max-height:260px;object-fit:cover;border-radius:6px}
.cpv hr{border:0;border-top:1px solid #4a4d55;margin:2px 0;width:100%}
.cpv .sp-l{height:14px}
.imgp{display:flex;flex-direction:column;gap:6px}
.imgp .ir{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.imgp .ir input[type=text]{flex:1;min-width:140px}
.imgp img{max-height:70px;max-width:140px;border-radius:6px;border:1px solid var(--line);object-fit:cover}
.itbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ithead{font-weight:700;font-size:13px;margin-bottom:6px;color:var(--muted,#b5bac1)}
.wth{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.wth .w{position:relative}
.wth img{height:80px;border-radius:6px;border:1px solid var(--line);object-fit:cover}
.wth .x{position:absolute;top:-6px;right:-6px;padding:2px 7px}
.edet.bad{border-color:#da373c}
#savebar{position:fixed;left:0;right:0;bottom:-80px;background:var(--panel2);border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:12px;align-items:center;justify-content:center;transition:bottom .2s;z-index:9}
#savebar.show{bottom:0}
#toast{position:fixed;top:70px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:20}
.t{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--blue);padding:10px 14px;border-radius:8px;max-width:340px}
.t.err{border-left-color:var(--red)} .t.ok{border-left-color:var(--green)}
.warn{background:#3b2f1a;border:1px solid #6b5420;border-radius:10px;padding:10px 14px;margin-bottom:14px}
code{background:var(--panel2);border-radius:4px;padding:1px 5px}
ul.cl{padding-left:18px;margin:6px 0} ul.cl li{margin:3px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else if (k === 'checked') e.checked = !!v;
    else if (k === 'selected') e.selected = !!v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
}
// replaceChildren/append aceitam listas aninhadas e ignoram null/false (evita aparecer "null" e "[object HTMLDivElement]").
for (const fn of ['replaceChildren', 'append']) {
  const orig = Element.prototype[fn];
  Element.prototype[fn] = function (...kids) {
    return orig.apply(this, kids.flat(Infinity).filter((k) => k != null && k !== false));
  };
}
function toast(msg, type = '') {
  const t = h('div', { class: 't ' + type }, msg);
  $('#toast').append(t);
  setTimeout(() => t.remove(), 4500);
}
async function api(path, opts = {}) {
  const r = await fetch(path, { credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (r.status === 401) { st.me = null; render(); throw new Error('Sessão expirada. Entre de novo.'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Erro ' + r.status);
  return j;
}

const st = { me: null, bot: null, langs: [], guilds: [], gid: null, data: null, cfg: null, tab: 'home', dirty: false, onChange: null };

/* ---------- helpers de formulário ---------- */
let t0;
function dirty() {
  st.dirty = true;
  $('#savebar')?.classList.add('show');
  clearTimeout(t0);
  if (st.onChange) t0 = setTimeout(st.onChange, 700);
}
const chOpts = () => st.data.channels.map((c) => ({ v: c.id, t: '#' + c.name }));
const roleOpts = () => st.data.roles.map((r) => ({ v: r.id, t: '@' + r.name + (r.assignable ? '' : '  (acima do bot)') }));
const roleName = (id) => st.data.roles.find((r) => r.id === id)?.name || '(cargo removido)';
const chanName = (id) => st.data.channels.find((c) => c.id === id)?.name || '(canal removido)';

function field(label, ctrl, hint) {
  return h('label', { class: 'field' }, h('span', { class: 'lbl' }, label), ctrl, hint ? h('small', {}, hint) : null);
}
function tInput(o, k, { ph = '', max } = {}) {
  return h('input', { type: 'text', value: o[k] ?? '', placeholder: ph, maxlength: max, oninput: (e) => { o[k] = e.target.value; dirty(); } });
}
function nInput(o, k, min, max, step = 1) {
  return h('input', { type: 'number', value: o[k], min, max, step, oninput: (e) => { o[k] = e.target.value === '' ? '' : Number(e.target.value); dirty(); } });
}
function cInput(o, k) {
  return h('input', { type: 'color', value: o[k] || '#ffffff', oninput: (e) => { o[k] = e.target.value; dirty(); } });
}
function chk(o, k, label) {
  return h('label', { class: 'chk' }, h('input', { type: 'checkbox', checked: !!o[k], onchange: (e) => { o[k] = e.target.checked; dirty(); } }), label);
}
function sel(o, k, options, { empty = '— escolher —', num = false } = {}) {
  const s = h('select', { onchange: (e) => { o[k] = num ? Number(e.target.value) : e.target.value; dirty(); } },
    empty != null ? h('option', { value: '' }, empty) : null,
    options.map((x) => h('option', { value: x.v, selected: String(o[k]) === String(x.v) }, x.t)));
  return s;
}
function tArea(o, k, { rows = 4, max = 2000, tools = true, vars: varList } = {}) {
  const ta = h('textarea', { rows, maxlength: max, oninput: (e) => { o[k] = e.target.value; dirty(); } });
  ta.value = o[k] ?? '';
  if (!tools) return ta;
  const insert = (text) => {
    const a = ta.selectionStart ?? ta.value.length, b = ta.selectionEnd ?? a;
    ta.value = ta.value.slice(0, a) + text + ta.value.slice(b);
    ta.focus(); ta.selectionStart = ta.selectionEnd = a + text.length;
    o[k] = ta.value; dirty();
  };
  const mk = (ph, opts, fn) => {
    const s = h('select', { onchange: (e) => { if (e.target.value) fn(e.target.value); e.target.value = ''; } },
      h('option', { value: '' }, ph), opts.map((x) => h('option', { value: x.v }, x.t)));
    return s;
  };
  const vars = (varList || ['{user}', '{username}', '{server}', '{count}', '{level}', '{args}']).map((v) => ({ v, t: v }));
  return h('div', {}, ta, h('div', { class: 'mbar' },
    vars.length ? mk('+ variável', vars, insert) : null,
    mk('+ mencionar cargo', st.data.roles.map((r) => ({ v: r.id, t: '@' + r.name })), (id) => insert('<@&' + id + '>')),
    mk('+ mencionar canal', st.data.channels.map((c) => ({ v: c.id, t: '#' + c.name })), (id) => insert('<#' + id + '>'))));
}
/** Seleção múltipla em "chips". */
function multi(o, k, options, { label = 'adicionar…' } = {}) {
  const box = h('div');
  const nameOf = (v) => options.find((x) => x.v === v)?.t || v;
  const draw = () => {
    box.replaceChildren(
      h('div', { class: 'chips' }, (o[k] || []).map((v, i) =>
        h('span', { class: 'chip' }, nameOf(v), h('button', { onclick: () => { o[k].splice(i, 1); dirty(); draw(); } }, '×')))),
      h('select', { onchange: (e) => { const v = e.target.value; if (v && !o[k].includes(v)) { o[k].push(v); dirty(); } draw(); } },
        h('option', { value: '' }, '+ ' + label), options.filter((x) => !(o[k] || []).includes(x.v)).map((x) => h('option', { value: x.v }, x.t))));
  };
  draw();
  return box;
}
function listEditor(arr, makeItem, row, addLabel, max = 100) {
  const box = h('div');
  const draw = () => {
    box.replaceChildren(
      arr.map((it, i) => h('div', { class: 'item' },
        h('button', { class: 'btn danger small x', onclick: () => { arr.splice(i, 1); dirty(); draw(); } }, 'Remover'),
        row(it, i, draw))),
      arr.length < max ? h('button', { class: 'btn ghost', onclick: () => { arr.push(makeItem()); dirty(); draw(); } }, '+ ' + addLabel) : null);
  };
  draw();
  return box;
}
const card = (title, sub, ...kids) => h('div', { class: 'card' }, h('h3', {}, title), sub ? h('p', { class: 'sub' }, sub) : null, ...kids);

/* ---------- prévia estilo Discord ---------- */
function discordText(text, sample = {}) {
  const out = [];
  const vars = { '{user}': '@' + (st.me.user.username), '{username}': st.me.user.username, '{server}': st.data.guild.name,
    '{count}': '123', '{level}': '5', '{args}': 'argumento', '{displayname}': st.me.user.username, '{id}': st.me.user.id, '{channel}': '#canal', ...sample };
  const t = String(text || '').replace(/\{(user|username|displayname|server|count|level|args|id|channel)\}/gi, (m) => vars[m.toLowerCase()] ?? m);
  const re = /(<@&(\d+)>|<#(\d+)>|\*\*(.+?)\*\*)/g;
  let last = 0, m;
  while ((m = re.exec(t))) {
    if (m.index > last) out.push(t.slice(last, m.index));
    if (m[2]) { const r = st.data.roles.find((x) => x.id === m[2]); out.push(h('span', { class: 'men', style: r?.color ? 'color:' + r.color : '' }, '@' + (r?.name || 'cargo'))); }
    else if (m[3]) out.push(h('span', { class: 'men' }, '#' + chanName(m[3])));
    else out.push(h('b', {}, m[4]));
    last = re.lastIndex;
  }
  if (last < t.length) out.push(t.slice(last));
  return out;
}
function msgPreview(text, imgEl) {
  return h('div', { class: 'dpreview' },
    h('img', { class: 'av', src: st.bot.avatar, alt: '' }),
    h('div', { style: 'min-width:0;flex:1' },
      h('div', {}, h('span', { class: 'nm' }, st.bot.username), h('span', { class: 'tag' }, '✓ APP')),
      h('div', { class: 'body' }, discordText(text)), imgEl));
}

/* ---------- abas ---------- */
const TABS = [
  ['home', '🏠 Início'], ['welcome', '👋 Boas-vindas'], ['leave', '🚪 Saída'], ['roles', '🎛️ Cargos / Botões'], ['messages', '📨 Mensagens / Embeds'], ['wiki', '📖 Wiki de Capos'], ['tickets', '🎫 Tickets'], ['autoroles', '🏷️ Autoroles'], ['moderation', '🔨 Moderação'], ['logs', '📜 Logs'],
  ['levels', '⭐ Rank / Níveis'], ['commands', '⌨️ Comandos'], ['interaction', '💬 Interação'],
  ['translate', '🌐 Tradução'], ['games', '🎮 Mini jogos'], ['identity', '🎭 Identidade'], ['expressions', '😀 Emojis / Figurinhas'], ['premium', '💎 Premium'],
];

function tabHome() {
  return h('div', {},
    !st.data.botCanManageRoles ? h('div', { class: 'warn' }, '⚠️ O bot não tem a permissão ', h('b', {}, 'Gerenciar Cargos'), ' neste servidor. Os botões de cargo e as recompensas de nível não vão funcionar até você dar essa permissão (e deixar o cargo do bot acima dos cargos que ele vai entregar).') : null,
    card('Como usar', 'Escolha uma aba acima, ajuste e clique em "Salvar alterações" (barra que aparece embaixo). 💎 = recurso com limite no plano grátis ou exclusivo do Premium.',
      h('ul', { class: 'cl' },
        h('li', {}, '👋 ', h('b', {}, 'Boas-vindas / Saída'), ': mensagem de texto e, no Premium, cartão com a foto do membro. 💎'),
        h('li', {}, '🎛️ ', h('b', {}, 'Cargos / Botões'), ': painéis com botões coloridos para o membro pegar cargos. 💎'),
        h('li', {}, '📨 ', h('b', {}, 'Mensagens / Embeds'), ': avisos e regras com cores, imagens e campos, publicados em um canal. 💎'),
        h('li', {}, '📖 ', h('b', {}, 'Wiki de Capos'), ': fichas de personagens que o bot envia ao digitar ', h('code', {}, '!nome'), '. 💎'),
        h('li', {}, '🎫 ', h('b', {}, 'Tickets'), ': atendimento privado com tipos, equipe, log e transcrição. 💎'),
        h('li', {}, '🏷️ ', h('b', {}, 'Autoroles'), ': cargo automático para quem entra (visitante) e para bots. 💎 Premium'),
        h('li', {}, '🔨 ', h('b', {}, 'Moderação'), ': automod (spam, convites, links, palavras) e punição por avisos. 💎 Premium'),
        h('li', {}, '📜 ', h('b', {}, 'Logs'), ': registra mensagens, entradas, cargos, bans e canais num canal da equipe. 💎 Premium'),
        h('li', {}, '⭐ ', h('b', {}, 'Rank / Níveis'), ': XP por mensagem, avisos de nível e cargos de recompensa. 💎'),
        h('li', {}, '⌨️ ', h('b', {}, 'Comandos'), ': crie comandos como ', h('code', {}, '!regras'), ' sem programar. 💎'),
        h('li', {}, '💬 ', h('b', {}, 'Interação'), ': respostas e reações automáticas a palavras. 💎'),
        h('li', {}, '🌐 ', h('b', {}, 'Tradução'), ': traduz canais automaticamente e por reação de bandeira. 💎'),
        h('li', {}, '🎮 ', h('b', {}, 'Mini jogos'), ': quiz, adivinhar, rali, ship, RPG da máfia e mais. 💎'),
        h('li', {}, '😀 ', h('b', {}, 'Emojis / Figurinhas'), ': envie várias imagens de uma vez e o bot cria os emojis e figurinhas no servidor (qsd_01, qsd_02…).'),
        h('li', {}, '🎭 ', h('b', {}, 'Identidade'), ': nome, foto, banner e bio do bot só no seu servidor. 💎 Premium'),
        h('li', {}, '💎 ', h('b', {}, 'Premium'), ': veja o plano, a validade e o que cada recurso libera.'))),
    card('Comandos de barra do bot', 'Digite / no chat do Discord para ver todos.',
      ...[

  const img = h('img', { class: 'prev', alt: 'prévia' });
  const wrap = h('div');
  const refresh = async () => {
    if (!c.useImage) { img.removeAttribute('src'); img.style.display = 'none'; return; }
    img.style.display = '';
    try {
      const r = await fetch('/api/guilds/' + st.gid + '/preview/' + kind, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(c) });
      if (!r.ok) throw new Error((await r.json()).error || 'Erro na prévia');
      const old = img.src; img.src = URL.createObjectURL(await r.blob()); if (old.startsWith('blob:')) URL.revokeObjectURL(old);
    } catch (e) { toast(e.message, 'err'); }
  };
  const textPrev = h('div');
  const drawText = () => textPrev.replaceChildren(msgPreview(c.message, img));
  st.onChange = () => { drawText(); refresh(); };
  drawText(); refresh();

    try {

      await api('/api/guilds/' + st.gid + '/test/' + kind, { method: 'POST' });

  wrap.append(
    card(isW ? 'Mensagem de boas-vindas' : 'Mensagem de saída', 'Enviada quando alguém ' + (isW ? 'entra no' : 'sai do') + ' servidor.',

      h('div', { class: 'row' },
        field('Título', tInput(c, 'title', { max: 40 })),
        field('Subtítulo', tInput(c, 'subtitle', { max: 70 }))),
      h('div', { class: 'row' },
        field('Cor da borda da foto', cInput(c, 'accent')), field('Cor do título', cInput(c, 'titleColor')),

      field('Texto da DM', tArea(c, 'dmMessage', { rows: 3 }))) : null,
    card('Prévia', 'É assim que vai aparecer no Discord (com a sua foto de exemplo).', textPrev,

  return wrap;

function filePicker(o, k, round) {
  const box = h('div', { class: 'imgp' });
  const draw = () => {
    const v = o[k] || '';
    const file = h('input', { type: 'file', accept: 'image/png,image/jpeg,image/gif,image/webp', style: 'display:none' });
    file.addEventListener('change', async () => {
      const f = file.files && file.files[0];
      if (!f) return;
      if (f.size > 8 * 1024 * 1024) { toast('Imagem muito grande (máx. 8 MB).', 'err'); return; }
      try {
        const r = await fetch('/api/guilds/' + st.gid + '/uploads' + (round ? '?round=1' : ''), { method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/octet-stream' }, body: await f.arrayBuffer() });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || 'Erro ' + r.status);
        o[k] = j.ref; dirty(); draw();
        toast('Imagem enviada! Toque em "Aplicar no servidor".', 'ok');
      } catch (e) { toast(e.message, 'err'); }
    });
    box.replaceChildren(
      h('div', { class: 'ir' },
        h('button', { class: 'btn ghost small', type: 'button', onclick: () => { file.value = ''; file.click(); } }, v ? '🔁 Trocar imagem' : '📁 Enviar do aparelho'),
        v ? h('button', { class: 'btn danger small', type: 'button', onclick: () => { o[k] = ''; dirty(); draw(); } }, 'Limpar') : null,
        file),
      v ? hideOnError(h('img', { src: imgSrc(v), alt: '', style: 'max-width:' + (k === 'banner' ? '320px' : '120px') + ';border-radius:' + (k === 'avatar' ? '50%' : '8px') + ';margin-top:8px' })) : null);
  };
  draw();
  return box;
}

function imgSrc(v) {
  v = String(v || '');
  return v.indexOf('up:') === 0 ? '/api/guilds/' + st.gid + '/uploads/' + v.slice(3) : v;
}

function imgPicker(o, k, canRound) {
  const box = h('div', { class: 'imgp' });
  const draw = () => {
    const v = o[k] || '';
    const mine = v.indexOf('up:') === 0;
    const txt = h('input', { type: 'text', maxlength: 500, placeholder: mine ? 'Imagem enviada do aparelho ✔' : 'https://… (ou envie do aparelho)',
      oninput: (e) => { o[k] = e.target.value; dirty(); } });
    txt.value = mine ? '' : v;
    if (mine) txt.disabled = true;
    const file = h('input', { type: 'file', accept: 'image/png,image/jpeg,image/gif,image/webp', style: 'display:none' });
    let wantRound = false;
    file.addEventListener('change', async () => {
      const f = file.files && file.files[0];
      if (!f) return;
      if (f.size > 8 * 1024 * 1024) { toast('Imagem muito grande (máx. 8 MB).', 'err'); return; }
      try {
        const r = await fetch('/api/guilds/' + st.gid + '/uploads' + (wantRound ? '?round=1' : ''), { method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/octet-stream' }, body: await f.arrayBuffer() });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || 'Erro ' + r.status);
        o[k] = j.ref; dirty(); draw(); if (st.onChange) st.onChange();
        toast('Imagem enviada!', 'ok');
      } catch (e) { toast(e.message, 'err'); }
    });
    box.replaceChildren(
      h('div', { class: 'ir' }, txt,
        h('button', { class: 'btn ghost small', type: 'button', onclick: () => { wantRound = false; file.value = ''; file.click(); } }, '📁 Enviar do aparelho'),
        canRound ? h('button', { class: 'btn ghost small', type: 'button', onclick: () => { wantRound = true; file.value = ''; file.click(); } }, '⭕ Enviar redonda') : null,
        v ? h('button', { class: 'btn danger small', type: 'button', onclick: () => { o[k] = ''; dirty(); draw(); if (st.onChange) st.onChange(); } }, 'Limpar') : null,
        file),
      v ? hideOnError(h('img', { src: imgSrc(v), alt: '' })) : null);
  };
  draw();
  return box;

function newItem(type) {
  if (type === 'text') return { type: 'text', content: '' };
  if (type === 'section') return { type: 'section', content: '', image: '', desc: '' };
  if (type === 'gallery') return { type: 'gallery', images: [{ src: '', desc: '' }] };
  return { type: 'separator', divider: true, large: false };
}

function mdLines(text) {
  const out = [];
  String(text || '').split('\n').forEach((ln) => {
    const m = /^(#{1,3}) (.*)$/.exec(ln);
    if (m) out.push(h('div', { class: 'cpv-h' + m[1].length }, discordText(m[2])));
    else out.push(h('div', {}, ln ? discordText(ln) : h('br')));
  });
  return out;
}

function containerPreview(c) {
  const kids = [];
  c.items.forEach((it) => {
    if (it.type === 'text' && it.content.trim()) kids.push(h('div', {}, mdLines(it.content)));
    else if (it.type === 'section' && it.content.trim()) {
      kids.push(h('div', { class: 'cpv-sec' }, h('div', { style: 'min-width:0;flex:1' }, mdLines(it.content)),
        it.image ? hideOnError(h('img', { class: 'epv-thumb', src: imgSrc(it.image), alt: '' })) : null));
    } else if (it.type === 'gallery') {
      const imgs = it.images.filter((g) => g.src);
      if (imgs.length) kids.push(h('div', { class: 'cpv-gal' + (imgs.length === 1 ? ' one' : '') }, imgs.map((g) => hideOnError(h('img', { src: imgSrc(g.src), alt: '' })))));
    } else if (it.type === 'separator') {
      kids.push(it.divider ? h('hr') : h('div', { class: 'sp-s' }));
      if (it.large) kids.push(h('div', { class: 'sp-l' }));
    }
  });
  return h('div', { class: 'cpv', style: c.color ? 'border-left-color:' + c.color : '' },
    kids.length ? kids : h('p', { class: 'sub' }, 'Adicione itens para ver a prévia.'));
}

function containerEditor(c, MV) {

    items.replaceChildren(c.items.map((it, i) => {
      let body;
      if (it.type === 'text') {
        body = field('Texto', tArea(it, 'content', Object.assign({ rows: 5, max: 2000 }, MV)),

      return h('div', { class: 'item' },

        body,
        h('div', { class: 'itbar' },
          i > 0 ? h('button', { class: 'btn ghost small', type: 'button', onclick: () => { c.items.splice(i - 1, 0, c.items.splice(i, 1)[0]); dirty(); redraw(); } }, '↑ Subir') : null,
          i < c.items.length - 1 ? h('button', { class: 'btn ghost small', type: 'button', onclick: () => { c.items.splice(i + 1, 0, c.items.splice(i, 1)[0]); dirty(); redraw(); } }, '↓ Descer') : null,
          h('button', { class: 'btn danger small', type: 'button', onclick: () => { c.items.splice(i, 1); dirty(); redraw(); } }, 'Remover')));
    }));
  };
  drawItems();

    chk(c, 'spoiler', 'Esconder o container como spoiler'),
    h('div', { class: 'lbl-s' }, 'ITENS DO CONTAINER (na ordem em que aparecem)'),
    items,
    h('div', { class: 'itbar' }, add('text'), add('section'), add('gallery'), add('separator')));
  return box;
}

function newEmbed() {
  return { title: '', url: '', description: '', color: '#5865f2', authorName: '', authorIcon: '', authorUrl: '',
    thumbnail: '', image: '', footerText: '', footerIcon: '', timestamp: false, fields: [] };
}
function embedHasContent(e) {
  return !!(e.title || e.description || e.authorName || e.footerText || e.image || e.thumbnail || (e.fields && e.fields.length));
}
function hideOnError(img) { img.addEventListener('error', () => { img.style.display = 'none'; }); return img; }

function embedPreview(e) {
  const t = (x) => discordText(x);
  const main = h('div', { class: 'epv-main' });
  if (e.authorName) main.append(h('div', { class: 'epv-author' }, e.authorIcon ? hideOnError(h('img', { src: imgSrc(e.authorIcon), alt: '' })) : null, h('span', {}, t(e.authorName))));
  if (e.title) main.append(h('div', { class: 'epv-title' + (e.url ? ' link' : '') }, t(e.title)));
  if (e.description) main.append(h('div', { class: 'epv-desc' }, t(e.description)));
  if (e.fields && e.fields.length) {
    main.append(h('div', { class: 'epv-fields' }, e.fields.map((f) =>
      h('div', { class: 'epv-f' + (f.inline ? ' inl' : '') }, h('div', { class: 'epv-fn' }, t(f.name)), h('div', { class: 'epv-fv' }, t(f.value))))));
  }
  if (e.image) main.append(hideOnError(h('img', { class: 'epv-img', src: imgSrc(e.image), alt: '' })));
  const foot = [e.footerText, e.timestamp ? 'Hoje às 12:00' : ''].filter(Boolean).join(' • ');
  if (foot) main.append(h('div', { class: 'epv-foot' }, e.footerIcon ? hideOnError(h('img', { src: imgSrc(e.footerIcon), alt: '' })) : null, h('span', {}, foot)));
  return h('div', { class: 'epv', style: 'border-left-color:' + e.color },
    h('div', { class: 'epv-row' }, main, e.thumbnail ? hideOnError(h('img', { class: 'epv-thumb', src: imgSrc(e.thumbnail), alt: '' })) : null));
}

  draw();

/* ---------- Wiki de Capos ---------- */
async function wikiUpload(file, hq) {
  if (file.size > 8 * 1024 * 1024) throw new Error(file.name + ': imagem muito grande (máx. 8 MB).');
  const r = await fetch('/api/guilds/' + st.gid + '/wiki/upload' + (hq ? '?hq=1' : ''), { method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/octet-stream' }, body: await file.arrayBuffer() });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Erro ' + r.status);
  return j.ref;
}

function guessCmdName(fileName) {
  const base = String(fileName || '').replace(/\.[^.]+$/, '').toLowerCase().replace(/[^a-z0-9À-ÿ_-]/g, '');
  if (!base || /^(screenshot|img|image|imagem|print|whatsapp|photo|foto|pxl|dsc|\d)/.test(base)) return '';
  return base.slice(0, 32);
}

/* ---------- Emojis e figurinhas do servidor ---------- */
function tabExpressions() {
  const log = h('div');
  const gallery = h('div', { style: 'margin-top:14px' });
  const item = (type, x) => h('div', { style: 'display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line,#2a2d33)' },
    hideOnError(h('img', { src: x.url, alt: '', style: 'width:' + (type === 'sticker' ? '56px' : '36px') + ';height:' + (type === 'sticker' ? '56px' : '36px') + ';object-fit:contain;border-radius:6px;background:#1d1f24' })),
    h('span', { style: 'flex:1' }, h('code', {}, x.name), x.animated ? ' (animado)' : ''),
    h('button', { class: 'btn danger small', onclick: async () => {
      if (!confirm('Apagar ' + x.name + ' do servidor? Isso não pode ser desfeito.')) return;
      try { await api('/api/guilds/' + st.gid + '/expressions/' + type + '/' + x.id, { method: 'DELETE' }); toast(x.name + ' apagado.', 'ok'); loadList(); }
      catch (e) { toast(e.message, 'err'); }
    } }, '🗑️ Apagar'));
  async function loadList() {
    gallery.replaceChildren(h('p', { style: 'color:var(--muted)' }, '⏳ Carregando…'));
    try {
      const d = await api('/api/guilds/' + st.gid + '/expressions');
      gallery.replaceChildren(
        h('h4', {}, '😀 Emojis do painel (' + d.emojis.length + ')'),
        d.emojis.length ? d.emojis.map((x) => item('emoji', x)) : h('p', { style: 'color:var(--muted)' }, 'Nenhum ainda.'),
        h('h4', { style: 'margin-top:14px' }, '🖼️ Figurinhas do painel (' + d.stickers.length + ')'),
        d.stickers.length ? d.stickers.map((x) => item('sticker', x)) : h('p', { style: 'color:var(--muted)' }, 'Nenhuma ainda.'),
        h('p', { class: 'sub', style: 'margin-top:10px' }, 'Aqui aparecem só os itens criados pelo painel (qsd_01, qsd_02…). Os outros emojis do servidor não são mexidos.'));
    } catch (e) { gallery.replaceChildren(h('p', { style: 'color:#ff8a8a' }, '⚠️ ' + e.message)); }
  }
  setTimeout(loadList, 0);
  const pick = (type) => {
    const f = h('input', { type: 'file', accept: 'image/png,image/jpeg,image/gif,image/webp', multiple: true, style: 'display:none' });
    f.addEventListener('change', async () => {
      const list = Array.from(f.files || []);
      let ok = 0; const fails = [];
      for (let i = 0; i < list.length; i++) {
        log.replaceChildren(h('p', {}, '⏳ Enviando ' + (i + 1) + ' de ' + list.length + '…'));
        try {
          if (list[i].size > 8 * 1024 * 1024) throw new Error('arquivo grande demais');
          const r = await fetch('/api/guilds/' + st.gid + '/expressions/' + type, { method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/octet-stream' }, body: await list[i].arrayBuffer() });
          const j = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(j.error || 'Erro ' + r.status);
          ok++;
        } catch (e) {
          fails.push(list[i].name + ': ' + e.message);
          if (/^Limite|^O bot precisa/.test(e.message)) break;
        }
      }
      log.replaceChildren(
        h('p', {}, '✅ ' + ok + ' criado(s) de ' + list.length + '.'),
        fails.map((x) => h('p', { style: 'color:#ff8a8a' }, '⚠️ ' + x)));
      loadList();
    });
    f.click();
  };
  return card('😀 Emojis e figurinhas do servidor', 'Escolha várias imagens: o bot cria tudo no seu servidor, nomeando qsd_01, qsd_02… em ordem. GIF vira animado.',
    h('div', { class: 'dbtns' },
      h('button', { class: 'btn', onclick: () => pick('emoji') }, '😀 Importar emojis'),
      h('button', { class: 'btn', onclick: () => pick('sticker') }, '🖼️ Importar figurinhas')),
    log, gallery);
}

/* ---------- salvar / carregar ---------- */
async function save() {
  const r = await api('/api/guilds/' + st.gid + '/config', { method: 'PUT', body: st.cfg });
  st.cfg = r.config; st.data.config = r.config; st.dirty = false;
  $('#savebar')?.classList.remove('show');
  renderTab(); // religa os campos ao objeto salvo
  (r.notices || []).forEach((n) => toast('💎 ' + n, 'err'));
  toast('Alterações salvas!', 'ok');
  return r;
}
async function reloadData(redraw = true) {
  st.data = await api('/api/guilds/' + st.gid + '/data');
  st.cfg = JSON.parse(JSON.stringify(st.data.config));
  if (redraw) render();
  else renderTab();
}
async function openGuild(id) {
  try {
    st.gid = id; st.tab = 'home'; st.dirty = false;
    await reloadData(false);
    location.hash = 'g=' + id;
    render();
  } catch (e) { toast(e.message, 'err'); st.gid = null; render(); }
}

/* ---------- render ---------- */
function topbar() {
  const u = st.me?.user;
  return h('header', { class: 'top' },
    st.bot ? h('img', { src: st.bot.avatar, alt: '' }) : null,
    h('span', { class: 'brand' }, '⚙️ Painel do ' + (st.bot?.username || 'Bot')),
    h('span', { class: 'sp' }),
    u ? h('span', { style: 'color:var(--muted)' }, u.username) : null,
    st.gid ? h('button', { class: 'btn ghost small', onclick: () => { if (st.dirty && !confirm('Há alterações não salvas. Sair mesmo assim?')) return; st.gid = null; st.dirty = false; history.replaceState(null, '', '#'); render(); } }, 'Trocar servidor') : null,
    u ? h('a', { class: 'btn ghost small', href: '/auth/logout' }, 'Sair') : null);
}

function renderTab() {
  const el = $('#tabbody');
  if (!el) return;
  st.onChange = null;
  clearInterval(st.payTimer);
  el.replaceChildren(tabNotice(st.tab), TAB_FN[st.tab]());
  document.querySelectorAll('nav.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === st.tab));
}

function render() {
  const app = $('#app');
  app.replaceChildren(topbar());
  if (!st.me) {
    app.append(h('div', { class: 'wrap center' }, h('div', {},
      h('h1', {}, 'Painel do Bot'), h('p', { style: 'color:var(--muted)' }, 'Entre com sua conta do Discord para configurar o bot nos servidores que você administra.'),
      h('a', { class: 'btn', href: '/auth/login' }, 'Entrar com Discord'))));
    return;
  }
  if (!st.gid) {
    app.append(h('div', { class: 'wrap' }, h('h2', {}, 'Escolha um servidor'),
      st.guilds.length ? h('div', { class: 'grid' }, st.guilds.map((g) => h('div', { class: 'gcard' },
        g.icon ? h('img', { src: g.icon, alt: '' }) : h('div', { class: 'ph' }, g.name[0]),
        h('div', { class: 'nm' }, g.name),
        g.botIn ? h('button', { class: 'btn small', onclick: () => openGuild(g.id) }, 'Configurar')
          : h('a', { class: 'btn ghost small', href: g.invite, target: '_blank', rel: 'noopener' }, 'Adicionar bot')))) :
        h('p', { style: 'color:var(--muted)' }, 'Nenhum servidor encontrado onde você tenha a permissão "Gerenciar Servidor".')));
    return;
  }
  app.append(h('div', { class: 'wrap' },
    h('h2', { style: 'margin:0' }, st.data.guild.name),
    h('nav', { class: 'tabs' }, TABS.map(([k, label]) => h('button', { 'data-tab': k, class: k === st.tab ? 'on' : '', onclick: () => { st.tab = k; renderTab(); } }, label))),
    h('div', { id: 'tabbody' })),
    h('div', { id: 'savebar', class: st.dirty ? 'show' : '' },
      h('span', {}, 'Você tem alterações não salvas.'),
      h('button', { class: 'btn green', onclick: () => save().catch((e) => toast(e.message, 'err')) }, '💾 Salvar alterações'),
      h('button', { class: 'btn ghost', onclick: () => { if (confirm('Descartar alterações?')) { st.dirty = false; reloadData(); } } }, 'Descartar')));
  renderTab();
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
window.addEventListener('beforeunload', (e) => { if (st.dirty) { e.preventDefault(); e.returnValue = ''; } });

(async function boot() {
  try {
    const me = await api('/api/me');
    st.me = { user: me.user }; st.bot = me.bot; st.langs = me.langs;
    st.guilds = await api('/api/guilds');
    const m = location.hash.match(/g=(\d+)/);
    if (m && st.guilds.find((g) => g.id === m[1] && g.botIn)) return openGuild(m[1]);
  } catch { st.me = null; }
  render();
})();
</script>
</body>
</html>
